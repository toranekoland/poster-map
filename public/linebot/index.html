    <div class="container-sm my-5">
      
      <div class="col-lg-12 px-0">
        <p class="lead">ぴょん活報告BOTの使い方</p>
        <p>ぴょん活BOTはコマンドを受け取って活動報告を共有するツールです。
            LINE BOTに話しかけるとそれぞれのコマンドにそって活動報告を登録してくれます。
            一行目にコマンドを書き、二行目以降に報告内容を書きます。
        </p>

        <p class="lead">コマンド一覧</p>

        <p>ぴょん活スタート:簡単なマニュアルとこのページを表示します</p>
        <p>地図:ぴょん活報告mapを表示します</p>
        <p>ぴょん活報告:ポスティングの報告をすると地図を塗りつぶします</p>
        <p>ポスターマップ:選挙の時にポスター掲示板の完了報告をする</p>

        <p class="lead">サンプル</p>
